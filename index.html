<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Resources & Search</title>
</head>
<body style="font-family: system-ui, sans-serif; text-align: center; padding: 50px;">
    <h2>Academic Search Tool</h2>
    <form action="https://duckduckgo.com" method="GET" target="_blank">
        <input type="text" name="q" placeholder="Type search here..." required 
               style="width: 60%; padding: 12px; border: 2px solid #007bff; border-radius: 25px; outline: none; font-size: 16px;">
        <button type="submit" 
                style="padding: 12px 20px; background-color: #007bff; color: white; border: none; border-radius: 25px; margin-left: 8px; cursor: pointer; font-size: 16px; font-weight: bold;">
          Search
        </button>
    </form>
</body>
</html>
